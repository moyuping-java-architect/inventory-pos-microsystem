server.port=8091

spring.application.name=psi-sync

spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.auto-refresh=false
spring.cloud.nacos.discovery.register-enabled=false
spring.cloud.config.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/psi_sync_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

mybatis-plus.global-config.db-config.db-type=mysql

spring.flyway.enabled=true
spring.flyway.locations=classpath:DB/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.sql-migration-prefix=V


mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

logging.level.com.psi.sync=DEBUG
logging.level.com.psi.common=DEBUG
logging.level.org.mybatis=DEBUG

# ==================== RabbitMQ ?? ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=10000

# 消费者配置（关闭 Spring 内置重试，由死信队列处理重试）
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# PSI MQ ??
psi.mq.enabled=true
psi.mq.tenant-propagation-enabled=true