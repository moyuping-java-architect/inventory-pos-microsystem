    build: ./psi-cashier
    image: psi-cashier:latest
    container_name: psi-cashier-t01
    ports:
      - "8094:8088"
    environment:
      TERMINAL_ID: T01
      STORE_ID: S001
      PSI_SYNC_BASE_URL: http://psi-sync:8091
      PSI_STOCK_BASE_URL: http://psi-stock:8086
