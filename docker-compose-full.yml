x-skywalking-env: &skywalking-env
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
  SW_LOGGING_DIR: "/tmp/skywalking-logs"

services:
  # ===========================================================
  # 可观测性中间件（SkyWalking + Elasticsearch 7）
  # 启动命令：docker compose -f docker-compose-observability.yml up -d
  # ===========================================================

  # 基础设施
  mysql:
    image: mysql:8.0
    container_name: psi-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-extra-dbs.sql:/docker-entrypoint-initdb.d/extra-dbs.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-init:
    image: mysql:8.0
    container_name: psi-mysql-init
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./docker/mysql-extra-dbs.sql:/init.sql
    entrypoint: ["bash", "-c", "mysql -hmysql -uroot -proot < /init.sql && echo 'extra databases created'"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: psi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: psi-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: psi-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"

  # Java 微服务
  psi-gateway:
    build: ./psi-gateway
    image: psi-gateway:latest
    container_name: psi-gateway
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: gateway
      <<: *skywalking-env
      SW_AGENT_NAME: psi-gateway
      JAVA_OPTS: "-javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-gateway -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.profiles.active":"","spring.config.import":"","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      - nacos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  psi-goods:
    build:
      context: .
      dockerfile: ./psi-goods/Dockerfile
    image: psi-goods:latest
    container_name: psi-goods
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: goods
      <<: *skywalking-env
      SW_AGENT_NAME: psi-goods
      JAVA_OPTS: "-javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-goods -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.datasource.url":"jdbc:mysql://mysql:3306/psi_goods?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai","spring.datasource.username":"root","spring.datasource.password":"root","spring.data.redis.host":"redis","spring.rabbitmq.host":"rabbitmq","spring.rabbitmq.username":"admin","spring.rabbitmq.password":"admin","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

