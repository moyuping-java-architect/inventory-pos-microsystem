      SPRING_APPLICATION_JSON: >
        {"spring.datasource.url":"jdbc:mysql://mysql:3306/psi_sync_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai","spring.datasource.username":"root","spring.datasource.password":"root","spring.data.redis.host":"redis","spring.rabbitmq.host":"rabbitmq","spring.rabbitmq.username":"admin","spring.rabbitmq.password":"admin","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
