<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 482" width="100%" role="img">
  <title>PSI Microservices Platform - System Architecture</title>
  <desc>Layered architecture from clients, gateway, 12+ microservices, infrastructure to data layer, with Go inventory engine, multi-tenant isolation, event-driven design, and POS offline sync.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="482" fill="#1E1E1E"/>
  <text x="340" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#D3D1C7">PSI 微服务平台 · 系统架构</text>
  <text x="340" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#888780">12+ Java 微服务 + 1 Go 服务 · 648 API · 11 业务域</text>

  <rect x="40" y="64" width="600" height="56" rx="12" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
