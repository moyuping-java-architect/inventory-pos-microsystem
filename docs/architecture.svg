  <rect x="190" y="78" width="130" height="36" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="255" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9FE1CB">Vue 3 Web</text>
  <rect x="360" y="78" width="130" height="36" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="425" y="90" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9FE1CB">POS Terminals ×3</text>
  <text x="425" y="104" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5DCAA5">SQLite offline</text>

  <path d="M340 120 L340 132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="40" y="134" width="600" height="66" rx="12" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="50" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#888780">Gateway</text>
  <rect x="170" y="142" width="340" height="50" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#B5D4F4">Spring Cloud Gateway</text>
  <text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#85B7EB">JWT 认证 · 15-header 租户传播 · Redis 滑动窗口限流</text>

