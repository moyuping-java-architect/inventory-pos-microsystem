  <text x="262" y="328" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#85B7EB">Outbox · 死信</text>
  <rect x="354" y="294" width="128" height="48" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
