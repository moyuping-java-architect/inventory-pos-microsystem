  <text x="595" y="248" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B5D4F4">Workflow</text>

  <path d="M340 278 L340 282" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

