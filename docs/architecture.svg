  <text x="418" y="328" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#85B7EB">Lua · 锁 · 限流</text>
  <rect x="510" y="294" width="128" height="48" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="574" y="312" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B5D4F4">SkyWalking</text>
  <text x="574" y="328" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#85B7EB">APM + 追踪</text>

  <path d="M340 350 L340 354" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="40" y="356" width="600" height="56" rx="12" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="50" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#888780">Data</text>
  <rect x="190" y="370" width="130" height="36" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="255" y="388" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9FE1CB">MySQL 8 · 分库</text>
