# Docker 环境下使用的配置
server.port=8088

spring.application.name=psi-cashier

spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false

# SQLite 数据文件放到挂载的数据卷
spring.datasource.url=jdbc:sqlite:/app/data/myp.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=admin
spring.datasource.password=password

mybatis-plus.global-config.db-config.db-type=sqlite

spring.flyway.enabled=false

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

logging.level.com.psi.cashier=DEBUG
logging.level.com.psi.common=DEBUG
logging.level.org.mybatis=DEBUG

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

# Docker 里访问宿主机上的其他服务用 host.docker.internal
psi.sync.base-url=http://host.docker.internal:8090
psi.stock.base-url=http://host.docker.internal:8086

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# 终端/门店标识，可在 docker-compose 里按终端覆盖
psi.cashier.terminal-id=${TERMINAL_ID:T01}
psi.cashier.store-id=${STORE_ID:S001}

# 默认关闭打印，实际终端按需开启
psi.cashier.printer.type=network
psi.cashier.printer.ip=127.0.0.1
psi.cashier.printer.port=9100
psi.cashier.printer.name=
psi.cashier.printer.enable=false
