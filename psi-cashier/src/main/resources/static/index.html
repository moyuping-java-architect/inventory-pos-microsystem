<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSI收银系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .lang-switch {
            text-align: right;
            margin-bottom: 20px;
        }
        
        .lang-switch button {
            background: none;
            border: 1px solid #e0e0e0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #666;
            transition: all 0.2s;
            margin-left: 8px;
        }
        
        .lang-switch button:hover {
            background: #f5f5f5;
        }
        
        .lang-switch button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .logo p {
            color: #999;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #667eea;
        }
        
        .form-group input::placeholder {
            color: #bbb;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #999;
            font-size: 12px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lang-switch">
            <button id="btnZh" class="active" data-lang="zh_CN">中文</button>
            <button id="btnEn" data-lang="en">English</button>
        </div>
        
        <div class="logo">
            <h1 data-i18n="common.title">PSI收银系统</h1>
            <p data-i18n="common.cashier">收银终端系统</p>
        </div>
        
        <div class="error-message" id="errorMsg"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username" data-i18n="label.name">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" data-i18n-placeholder="hint.enterName" required>
            </div>
            
            <div class="form-group">
                <label for="password" data-i18n="label.reason">密码</label>
                <input type="password" id="password" placeholder="请输入密码" data-i18n-placeholder="hint.enterAmount" required>
            </div>
            
            <div class="form-group">
                <label for="shopCode" data-i18n="label.unit">门店编码（可选）</label>
                <input type="text" id="shopCode" placeholder="请输入门店编码">
            </div>
            
            <button type="submit" class="btn-login" id="btnLogin">
                <span id="btnText" data-i18n="button.register">登 录</span>
            </button>
        </form>
        
        <div class="footer">
            <p>© 2026 PSI. 保留所有权利。</p>
        </div>
    </div>
    
    <script src="js/locales/zh_CN.js"></script>
    <script src="js/locales/en.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
