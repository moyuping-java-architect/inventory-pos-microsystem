server.port=8088

spring.application.name=psi-cashier

spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false
#spring.autoconfigure.exclude=org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration,org.springframework.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration,org.springframework.cloud.nacos.config.NacosConfigAutoConfiguration

# SQLite 数据库路径（隐藏到系统深层目录，防收银员直接访问）
# 使用 Windows 系统目录：C:\ProgramData\PSI\sysconfig\（默认隐藏+需管理员权限）
# 如果未配置，默认使用应用目录下的 data/myp.db
psi.db.path=${PSI_DB_PATH:}

spring.datasource.url=jdbc:sqlite:${psi.db.path:data/myp.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=admin
spring.datasource.password=password

mybatis-plus.global-config.db-config.db-type=sqlite

spring.flyway.enabled=false

# SQLite 数据库自动初始化（首次启动自动建表）
psi.db.auto-init=true

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

logging.level.com.psi.cashier=DEBUG
logging.level.com.psi.common=DEBUG
logging.level.org.mybatis=DEBUG

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

# 同步/库存服务基础地址
psi.sync.base-url=http://localhost:8090
psi.stock.base-url=http://localhost:8086

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# 小票打印机配置
# 打印机类型：network（网络打印机） / usb（USB直连打印机）
psi.cashier.printer.type=usb

# 网络打印机配置（printer.type=network 时生效）
psi.cashier.printer.ip=127.0.0.1
psi.cashier.printer.port=9100

# USB打印机配置（printer.type=usb 时生效）
# 指定打印机名称，不指定则使用系统默认打印机
psi.cashier.printer.name=

# 是否启用打印功能
psi.cashier.printer.enable=true