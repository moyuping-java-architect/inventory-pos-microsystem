# =====================================================================
# PSI 生产环境部署 - 精简版（核心服务 + SkyWalking 可观测性）
# =====================================================================
# 解决三大交付风险：
#   1. 网络隔离  - 所有服务在同一文件，共享 default 网络
#   2. 配置变量  - 每个服务明确配置 SW_AGENT_NAME，不依赖变量展开
#   3. 内存不足  - 仅核心服务 + JVM 内存限制 + ES 内存限制
#
# 启动命令：
#   docker compose -f docker-compose-prod.yml up -d
#
# 停止命令：
#   docker compose -f docker-compose-prod.yml down
# =====================================================================

services:

  # ===========================================================
  # 基础设施（4个）
  # ===========================================================

  mysql:
    image: mysql:8.0
    container_name: psi-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-extra-dbs.sql:/docker-entrypoint-initdb.d/extra-dbs.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mysql-init:
    image: mysql:8.0
    container_name: psi-mysql-init
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./docker/mysql-extra-dbs.sql:/init.sql
    entrypoint: ["bash", "-c", "mysql -hmysql -uroot -proot < /init.sql && echo 'extra databases created'"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: psi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: psi-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: psi-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # ===========================================================
  # 可观测性（3个）- SkyWalking + Elasticsearch
  # ===========================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: psi-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - cluster.name=psi-sw-cluster
      - node.name=psi-sw-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: psi-skywalking-oap
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE_MODULE: storage-elasticsearch7
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      SW_STORAGE_ES_USER: ""
      SW_STORAGE_ES_PASSWORD: ""
      JAVA_OPTS: "-Xms256m -Xmx256m"
      SW_CORE_GRPC_PORT: 11800
      SW_CORE_REST_PORT: 12800
      SW_RECEIVER_LOGGING_ENABLED: "true"
      SW_SELF_OBSERVABILITY_ANALYZER: "false"
      SW_TELEMETRY: "prometheus"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12800/graphql --data '{\"query\":\"{queryHealthInfos(duration:{start:\\\"2024-01-01\\\",end:\\\"2024-01-02\\\",step:DAY}){score}}\"}' -H 'Content-Type: application/json'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: psi-skywalking-ui
    depends_on:
      skywalking-oap:
        condition: service_healthy
    ports:
      - "12900:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      SW_SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================
  # 核心业务服务（6个）- 已接入 SkyWalking
  # ===========================================================

  psi-gateway:
    build: ./psi-gateway
    image: psi-gateway:latest
    container_name: psi-gateway
    ports:
      - "8081:8081"
    environment:
      SW_AGENT_NAME: psi-gateway
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
      JAVA_OPTS: "-Xms128m -Xmx256m -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-gateway -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.profiles.active":"","spring.config.import":"","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  psi-system:
    build: ./psi-system
    image: psi-system:latest
    container_name: psi-system
    ports:
      - "8087:8087"
    environment:
      SW_AGENT_NAME: psi-system
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
      JAVA_OPTS: "-Xms128m -Xmx256m -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-system -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.datasource.url":"jdbc:mysql://mysql:3306/erp_system_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai","spring.datasource.username":"root","spring.datasource.password":"root","spring.data.redis.host":"redis","spring.rabbitmq.host":"rabbitmq","spring.rabbitmq.username":"admin","spring.rabbitmq.password":"admin","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  psi-goods:
    build:
      context: .
      dockerfile: ./psi-goods/Dockerfile
    image: psi-goods:latest
    container_name: psi-goods
    ports:
      - "8082:8082"
    environment:
      SW_AGENT_NAME: psi-goods
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
      JAVA_OPTS: "-Xms128m -Xmx256m -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-goods -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.datasource.url":"jdbc:mysql://mysql:3306/psi_goods?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai","spring.datasource.username":"root","spring.datasource.password":"root","spring.data.redis.host":"redis","spring.rabbitmq.host":"rabbitmq","spring.rabbitmq.username":"admin","spring.rabbitmq.password":"admin","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  psi-sale:
    build:
      context: .
      dockerfile: ./psi-sale/Dockerfile
    image: psi-sale:latest
    container_name: psi-sale
    ports:
      - "8083:8083"
    environment:
      SW_AGENT_NAME: psi-sale
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
      JAVA_OPTS: "-Xms128m -Xmx256m -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-sale -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.datasource.url":"jdbc:mysql://mysql:3306/psi_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai","spring.datasource.username":"root","spring.datasource.password":"root","spring.data.redis.host":"redis","spring.rabbitmq.host":"rabbitmq","spring.rabbitmq.username":"admin","spring.rabbitmq.password":"admin","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  psi-purchase:
    build:
      context: .
      dockerfile: ./psi-purchase/Dockerfile
    image: psi-purchase:latest
    container_name: psi-purchase
    ports:
      - "8084:8084"
    environment:
      SW_AGENT_NAME: psi-purchase
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
      JAVA_OPTS: "-Xms128m -Xmx256m -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-purchase -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.datasource.url":"jdbc:mysql://mysql:3306/psi_purchase?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai","spring.datasource.username":"root","spring.datasource.password":"root","spring.data.redis.host":"redis","spring.rabbitmq.host":"rabbitmq","spring.rabbitmq.username":"admin","spring.rabbitmq.password":"admin","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  psi-stock:
    build:
      context: .
      dockerfile: ./psi-stock/Dockerfile
    image: psi-stock:latest
    container_name: psi-stock
    ports:
      - "8085:8085"
    environment:
      SW_AGENT_NAME: psi-stock
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
      JAVA_OPTS: "-Xms128m -Xmx256m -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.config=/opt/skywalking/agent/config/agent.config -Dskywalking.agent.service_name=psi-stock -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.logging.dir=/tmp/skywalking-logs"
      SPRING_APPLICATION_JSON: >
        {"spring.datasource.url":"jdbc:mysql://mysql:3306/psi_stock?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai","spring.datasource.username":"root","spring.datasource.password":"root","spring.data.redis.host":"redis","spring.rabbitmq.host":"rabbitmq","spring.rabbitmq.username":"admin","spring.rabbitmq.password":"admin","spring.cloud.nacos.config.enabled":false,"spring.cloud.nacos.discovery.server-addr":"nacos:8848"}
    volumes:
      - ./docker/skywalking/skywalking-agent:/opt/skywalking/agent:ro
    entrypoint: ["/bin/sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  es-data:
    driver: local
