server.port=8089
spring.application.name=psi-flow
spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/psi_flow?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=false

spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false

# RabbitMQ listener retry: failed messages go to DLX after retries, not infinite requeue
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30000ms