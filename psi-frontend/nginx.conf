# 单体应用 nginx 配置
# 所有后端请求统一代理到 psi-app:8080

# ============================================================
# HTTP -> HTTPS 跳转（启用 HTTPS 时取消注释）
# ============================================================
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl;  # 启用 HTTPS 时取消注释
    server_name localhost;
    underscores_in_headers on;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ============================================================
    # HTTPS 证书配置（将证书放入 /etc/nginx/ssl/ 后取消注释）
    # ============================================================
    # ssl_certificate     /etc/nginx/ssl/server.crt;
    # ssl_certificate_key /etc/nginx/ssl/server.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    # 使用 Docker 内置 DNS 做动态解析，避免启动时找不到 upstream host
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $psi_app http://psi-app:8080;
    set $psi_cashier http://psi-cashier:8088;

    # 前端路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止缓存 index.html，确保前端发版后浏览器能立即加载最新 JS/CSS
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 收银端请求代理到 psi-cashier（变量方式：动态解析）
    location /psi/cashier/ {
        proxy_pass $psi_cashier;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /psi/order/ 请求重写为 /（单体后端 DocController 和 BizDocWorkflowController）
    # 变量方式：动态解析，且用 rewrite 去掉前缀
    location /psi/order/ {
        rewrite ^/psi/order/(.*)$ /$1 break;
        proxy_pass $psi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 所有 /psi/* 请求统一代理到单体后端（排除收银端和order）
    location /psi/ {
        proxy_pass $psi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
