server:
  port: 8080

spring:
  application:
    name: TradeMaster
  datasource:
    url: jdbc:mysql://localhost:3306/trademaster?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Africa/Lusaka&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      table-underline: true

jwt:
  secret: TradeMaster2026SecretKeyForZambia
  expire: 86400000

logging:
  level:
    com.trademaster: debug
    org.mybatis: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
